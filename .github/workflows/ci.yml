name: Continuous Integration

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: 🪝 pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      # The local isort and mypy hooks run through `uv run`, so sync the project first.
      - name: Install the project
        run: uv sync --group dev --python 3.12
      - name: Run all pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # Mocked tests: the MQP REST API is replaced by an in-memory stand-in
  # (test/mock_mqp.py), so they need neither a token nor network access and run
  # on every pull request, including those from forks.
  tests:
    name: 🐍 Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-26
            python: "3.13"
          - os: windows-2025
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Run the mocked tests
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uvx nox -s "tests-${PYTHON_VERSION}"
        shell: bash
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Switch to true (as in QDMI) once the repository is registered with Codecov.
          fail_ci_if_error: false
          files: coverage.xml
          flags: python

  # The same mocked tests against every supported Qiskit release.
  qiskit:
    name: ⚛️ Qiskit ${{ matrix.qiskit }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qiskit: ["0.46.3", "1.0.2", "1.1.2", "1.2.4", "1.3.3", "1.4.2", "2.0.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Run the mocked tests
        env:
          QISKIT_VERSION: ${{ matrix.qiskit }}
        run: uvx nox -s "qiskit(${QISKIT_VERSION})"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          files: coverage.xml
          flags: python

  # Tests against the real MQSS service. They need the MQSS_TOKEN secret, which
  # GitHub does not pass to pull requests from forks, so they run only on pushes
  # to develop and on manual runs, and are not part of the required check.
  live:
    name: 🌐 Live MQSS tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check for the MQSS token
        id: token
        env:
          MQSS_TOKEN: ${{ secrets.MQSS_TOKEN }}
        run: |
          if [ -z "$MQSS_TOKEN" ]; then
            echo "::notice::secrets.MQSS_TOKEN is not set; skipping the live tests."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        if: steps.token.outputs.present == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Run the live tests
        if: steps.token.outputs.present == 'true'
        env:
          MQSS_TOKEN: ${{ secrets.MQSS_TOKEN }}
        run: uvx nox -s live

  required-checks-pass: # This job does nothing and is only used for branch protection
    name: 🚦 Check
    if: always()
    needs:
      - pre-commit
      - tests
      - qiskit
    runs-on: ubuntu-24.04
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
