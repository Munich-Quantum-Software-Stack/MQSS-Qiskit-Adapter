# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Continuous Integration

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev  nlohmann-json3-dev librabbitmq-dev libboost-dev
          python -m pip install --upgrade pip
          pip install nox
          pip install uv
          uv sync --group dev
      - name: Run pre-commit
        run: |
          uv run pre-commit install
          uv run pre-commit run --all-files
      - name: Test Backend
        if:
          github.event.action == 'synchronize' && (contains(github.event.pull_request.changed_files,
          'mqss') || contains(github.event.pull_request.changed_files, 'tests'))
        env:
          MQP_TOKEN: ${{ secrets.MQP_TOKEN }}
        run: |
          uvx nox --session test_backend
      - name: Test Job when PR is merged
        if:
          github.event.pull_request.merged == true &&
          (contains(github.event.pull_request.changed_files, 'mqss') ||
          contains(github.event.pull_request.changed_files, 'tests'))
        env:
          MQP_TOKEN: ${{ secrets.MQP_TOKEN }}
        run: |
          uvx nox --session test_job
