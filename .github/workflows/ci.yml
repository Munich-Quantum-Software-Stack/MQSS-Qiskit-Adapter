# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Continuous Integration

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  testing:
    # ubuntu-latest (26.04) no longer provides Python 3.9; 24.04 still does.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nox
          pip install uv
          uv sync --group dev
      - name: Run pre-commit
        run: |
          uv run pre-commit install
          uv run pre-commit run --all-files
      - name: Test Backend
        if:
          github.event.action == 'synchronize' && (contains(github.event.pull_request.changed_files,
          'mqss') || contains(github.event.pull_request.changed_files, 'tests'))
        env:
          MQP_TOKEN: ${{ secrets.MQP_TOKEN }}
        run: |
          nox --session test_backend
      - name: Test Job when PR is merged
        if:
          github.event.pull_request.merged == true &&
          (contains(github.event.pull_request.changed_files, 'mqss') ||
          contains(github.event.pull_request.changed_files, 'tests'))
        env:
          MQP_TOKEN: ${{ secrets.MQP_TOKEN }}
        run: |
          nox --session test_job
      # Uploads only when one of the test sessions above has run and produced coverage.xml.
      - name: Upload coverage to Codecov
        if: hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          flags: python

  required-checks-pass: # This job does nothing and is only used for branch protection
    name: 🚦 Check
    if: always()
    needs:
      - testing
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
