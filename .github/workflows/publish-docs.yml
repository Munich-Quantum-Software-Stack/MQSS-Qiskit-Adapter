name: Update docs

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Build documentation
        run: |
          uv run mkdocs build

      - name: Checkout MQSS Interfaces repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Munich-Quantum-Software-Stack/MQSS-Interfaces
          ref: gh-pages
          path: MQSS-Interfaces
          ssh-key: ${{ secrets.MQSS_INTERFACES_DEPLOY_KEY }}
          persist-credentials: true # zizmor: ignore[artipacked] the deploy key is needed to push gh-pages

      - name: Configure git
        run: |
          cd MQSS-Interfaces
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Copy documentation to MQSS Interfaces repository
        run: |
          cd MQSS-Interfaces
          rm -rf qiskit/*
          mkdir -p qiskit/
          cp -r ../build/docs/site/* qiskit/

      - name: Commit and push changes to MQSS Interfaces repository
        run: |
          cd MQSS-Interfaces
          git add .
          git commit -m "Update MQSS Qiskit Adapter docs from GitHub Action" || echo "No changes to commit"
          git push origin gh-pages
