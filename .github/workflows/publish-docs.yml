name: Update docs

on:
  push:
    branches:
      - develop

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Build documentation
        run: |
          uv run mkdocs build

      - name: Checkout MQSS Interfaces repository
        uses: actions/checkout@v4
        with:
          repository: Munich-Quantum-Software-Stack/MQSS-Interfaces
          ref: gh-pages
          path: MQSS-Interfaces
          ssh-key: ${{ secrets.MQSS_INTERFACES_DEPLOY_KEY }}

      - name: Configure git
        run: |
          cd MQSS-Interfaces
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Copy documentation to MQSS Interfaces repository
        run: |
          cd MQSS-Interfaces
          rm -rf qiskit/*
          mkdir -p qiskit/
          cp -r ../build/docs/site/* qiskit/

      - name: Commit and push changes to MQSS Interfaces repository
        run: |
          cd MQSS-Interfaces
          git add .
          git commit -m "Update MQSS Qiskit Adapter docs from GitHub Action" || echo "No changes to commit"
          git push origin gh-pages
